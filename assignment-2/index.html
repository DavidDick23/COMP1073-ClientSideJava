<!DOCTYPE html>
<html lang="en">
    <!-- Core Behaviour -->
    <head>
        <!-- Tab Title -->
        <title>David Dick - Assignment-2 | COMP1073 Client-Side JavaScript</title>

        <!-- Meta Data -->
        <meta charset="utf-80" />
        <meta name="viewport" content="device-width", initial-scale="1.0" />

        <!-- CSS Links -->
        <link href="css/normalize.css" rel="stylesheet"/>
        <link href="css/styles.css" rel="stylesheet"/>

        <!-- JS Scripts -->
        <script src="js/assignment-2.js" defer></script>
    </head>

    <!-- Visible Page -->
    <body>
        <!-- Header Content -->
        <header>
            <h1>Pizza Order Form</h1>

            <!-- TODO: Add Student Name And ID Dynamically (JS) -->
            <p id="student"></p>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Pizza Order Form -->
            <form id="pizza-order-form">

                <!-- Size Selection -->
                <label for="size">Pizza Size:</label>
                <select id="size" name="size">
                    <option value="">-- Select Size --</option>
                    <option value="large">Large</option>
                    <option value="medium">Medium</option>
                    <option value="small">Small</option>
                </select>

                <!-- Line Break -->
                <br>

                <!-- Sauce Selection -->
                <label for="sauce">Sauce:</label>
                <select id="sauce" name="sauce">
                    <option value="">-- Select Sauce --</option>
                    <option value="tomato">Tomato</option>
                    <option value="bbq">BBQ</option>
                    <option value="alfredo">Alfredo</option>
                    <option value="ranch">Ranch</option>
                </select>

                <!-- Line Break -->
                <br>

                <!-- Toppings Selection -->
                <p>Toppings:</p>

                <!-- Cheese -->
                <input type="checkbox" id="cheese" name="toppings" value="Cheese">
                <label for="cheese">Cheese</label>

                <!-- Pepperoni -->
                <input type="checkbox" id="pepperoni" name="toppings" value="Pepperoni">
                <label for="pepperoni">Pepperoni</label>

                <!-- Mushrooms -->
                <input type="checkbox" id="mushrooms" name="toppings" value="Mushrooms">
                <label for="mushrooms">Mushrooms</label>

                <!-- Green Peppers -->
                <input type="checkbox" id="green-peppers" name="toppings" value="Green Peppers">
                <label for="green-peppers">Green Peppers</label>

                <!-- Onions -->
                <input type="checkbox" id="onions" name="toppings" value="Onions">
                <label for="onions">Onions</label> 

                <!-- Line Break -->
                <br>

                <!-- Submit -->
                <button type="submit">Place Order</button>
            </form>
        </main>

        <!-- Footer Content -->
        <footer>
            <p>&copy;2026 | David Dick - Assignment-2</p>
        </footer>
    </body>
</html>
